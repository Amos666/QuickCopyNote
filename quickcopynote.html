<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuickCopyNote</title>
<style>
  :root {
    --bg: #0e1114;
    --surface: #15191d;
    --surface-2: #1b2126;
    --border: #252c33;
    --border-soft: #1e242a;
    --text: #d6dce2;
    --text-dim: #8b97a3;
    --text-faint: #5a646e;
    --accent: #4fd1c5;
    --accent-dim: #2b6f69;
    --danger: #f0736c;
    --mark: #3a4a48;
    --radius-panel: 12px;
    --radius-row: 8px;
    --shadow: 0 24px 60px -12px rgba(0,0,0,.65);
    --mono: "Cascadia Code","Consolas","JetBrains Mono","SFMono-Regular",Menlo,monospace;
    --sans: "Microsoft YaHei UI","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: .01em;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body.pos-center { background: radial-gradient(1200px 600px at 50% -10%, #141a1f, var(--bg)); }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* 顶栏:分组 Tab + 右侧控件 */
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid var(--border-soft);
    background: var(--surface);
    -webkit-app-region: drag;
  }
  header button, header .tabs { -webkit-app-region: no-drag; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: transparent; color: var(--text-dim);
    font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; position: relative; transition: color .12s, background .12s;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.active { color: var(--accent); }
  .tab.active::after {
    content: ""; position: absolute; left: 10px; right: 10px; bottom: -9px;
    height: 2px; background: var(--accent); border-radius: 2px;
  }
  .tab .add { color: var(--text-faint); }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font: inherit;
    display: inline-flex; align-items: center; justify-content: center; transition: all .12s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent-dim); }
  .icon-btn.on { color: var(--accent); border-color: var(--accent-dim); background: #16211f; }

  .pos-switch { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .pos-switch button {
    border: 0; background: var(--surface-2); color: var(--text-faint); cursor: pointer;
    font: inherit; font-size: 11px; padding: 5px 8px; transition: all .12s;
  }
  .pos-switch button + button { border-left: 1px solid var(--border); }
  .pos-switch button:hover { color: var(--text); }
  .pos-switch button.active { color: var(--accent); background: #16211f; }

  /* 搜索行 */
  .searchbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); }
  .searchbar svg { flex: none; opacity: .5; }
  #search {
    flex: 1; background: transparent; border: 0; outline: 0; color: var(--text);
    font: inherit; font-size: 14px; padding: 4px 0;
  }
  #search::placeholder { color: var(--text-faint); }
  .hint { color: var(--text-faint); font-size: 11px; white-space: nowrap; }

  /* 主体:列表 + 预览 */
  main { flex: 1; display: flex; min-height: 0; }
  #listwrap { flex: 1; min-width: 0; overflow-y: auto; border-right: 1px solid var(--border-soft); }
  #list { list-style: none; margin: 0; padding: 4px; }
  .row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; border-radius: var(--radius-row); cursor: pointer;
    transition: background .1s, transform .12s ease-out; border: 1px solid transparent;
  }
  .row:hover { background: var(--surface); transform: translateX(2px); }
  .row.sel { background: var(--surface-2); border-color: var(--border); }
  .row.drag-over { border-top: 2px solid var(--accent); }
  .row .idx {
    flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 4px;
    background: var(--surface-2); color: var(--text-faint); font-size: 11px;
    display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-soft);
  }
  .row.sel .idx { color: var(--accent); border-color: var(--accent-dim); }
  .row .body { min-width: 0; flex: 1; }
  .row .title { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .snippet { color: var(--text-faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tags { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .tag { color: var(--accent-dim); font-size: 10px; }
  .tag::before { content: "#"; opacity: .6; }
  mark { background: var(--mark); color: var(--accent); border-radius: 2px; padding: 0 1px; }

  #preview {
    width: 320px; flex: none; overflow-y: auto; padding: 12px; background: var(--surface);
  }
  #preview h3 { margin: 0 0 8px; font-size: 13px; color: var(--text); font-weight: 600; }
  #preview pre {
    margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--text);
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
  }
  #preview .meta { margin-top: 12px; color: var(--text-faint); font-size: 11px; border-top: 1px solid var(--border-soft); padding-top: 8px; }
  .tok-cmd { color: var(--accent); }
  .tok-comment { color: var(--text-faint); }
  body.narrow #preview { display: none; }
  body.narrow #listwrap { border-right: 0; }

  /* 空态 */
  .empty { padding: 32px 20px; text-align: center; color: var(--text-faint); }
  .empty .big { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }

  /* 状态栏 */
  footer {
    display: flex; align-items: center; gap: 12px; height: 26px; padding: 0 10px;
    border-top: 1px solid var(--border-soft); background: var(--surface);
    color: var(--text-faint); font-size: 11px; flex: none;
  }
  footer .legend { display: flex; gap: 10px; overflow: hidden; white-space: nowrap; flex: 1; }
  kbd {
    background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.warn { background: #d9a441; }
  .switch { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track { width: 26px; height: 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); position: relative; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--text-faint); transition: transform .15s, background .15s; }
  .switch input:checked + .track { background: #16211f; border-color: var(--accent-dim); }
  .switch input:checked + .track::after { transform: translateX(12px); background: var(--accent); }

  /* 编辑弹窗 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal.hidden { display: none; }
  .sheet { width: min(560px, 92vw); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-panel); box-shadow: var(--shadow); overflow: hidden; }
  .sheet header { -webkit-app-region: no-drag; background: var(--surface-2); }
  .sheet .fields { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .sheet label { color: var(--text-dim); font-size: 11px; display: block; margin-bottom: 4px; }
  .sheet input, .sheet textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font: inherit; padding: 7px 9px; outline: 0;
  }
  .sheet input:focus, .sheet textarea:focus { border-color: var(--accent-dim); }
  .sheet textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
  .sheet .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border-soft); }
  .btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: all .12s; }
  .btn:hover { border-color: var(--accent-dim); }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #eafffb; }
  .btn.primary:hover { background: #35807a; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 20px);
    background: var(--surface-2); border: 1px solid var(--accent-dim); color: var(--text);
    padding: 7px 14px; border-radius: 8px; box-shadow: var(--shadow); opacity: 0;
    transition: opacity .18s, transform .18s; pointer-events: none; z-index: 100; font-size: 12px;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #333c45; }
  ::-webkit-scrollbar-track { background: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body class="pos-center">
<div id="app">
  <header>
    <div class="tabs" id="tabs"></div>
    <button class="icon-btn" id="btnAddGroup" title="新增分组">＋</button>
    <div class="pos-switch" id="posSwitch">
      <button data-pos="left" title="靠左">◧</button>
      <button data-pos="center" title="居中">◫</button>
      <button data-pos="right" title="靠右">◨</button>
    </div>
    <button class="icon-btn" id="btnPin" title="窗口置顶">📌</button>
  </header>

  <div class="searchbar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="search" placeholder="搜索标题 / 内容 / 标签,直接打字即可" spellcheck="false" autocomplete="off" />
    <span class="hint" id="count"></span>
  </div>

  <main>
    <div id="listwrap"><ul id="list"></ul></div>
    <aside id="preview"></aside>
  </main>

  <footer>
    <span id="svc"><span class="dot warn"></span>连接中…</span>
    <label class="switch" id="autostartWrap" title="开机自启(仅本地服务模式)">
      <input type="checkbox" id="autostart" /><span class="track"></span>开机自启
    </label>
    <span class="legend">
      <span><kbd>Enter</kbd> 复制</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> / <kbd>j</kbd><kbd>k</kbd> 选择</span>
      <span><kbd>/</kbd> 搜索</span>
      <span><kbd>Ctrl</kbd>+<kbd>N</kbd> 新增</span>
      <span><kbd>Ctrl</kbd>+<kbd>E</kbd> 编辑</span>
      <span><kbd>Alt</kbd>+<kbd>↑↓</kbd> 排序</span>
      <span><kbd>Ctrl</kbd>+<kbd>Tab</kbd> 切组</span>
      <span><kbd>Esc</kbd> 隐藏</span>
    </span>
  </footer>
</div>

<div class="modal hidden" id="editor">
  <div class="sheet">
    <header><strong id="editorTitle">编辑条目</strong></header>
    <div class="fields">
      <div><label>标题</label><input id="fTitle" placeholder="给这条命令起个名字" spellcheck="false" /></div>
      <div><label>内容(将被复制的文本)</label><textarea id="fText" spellcheck="false" placeholder="git diff …"></textarea></div>
      <div><label>标签(逗号分隔)</label><input id="fTags" placeholder="review, daily" spellcheck="false" /></div>
    </div>
    <div class="actions">
      <button class="btn danger" id="btnDelete">删除</button>
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">保存 (Ctrl+Enter)</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
(function () {
  const LS_KEY = 'qcn.state.v1';
  const $ = (s) => document.querySelector(s);

  // ---- 全局状态 ----
  let mode = 'local';            // 'server' | 'local'
  let cfg = { port: 7788, token: '', topmost: true, platform: '' };
  let state = { version: 1, ui: { position: 'center', activeGroup: null, theme: 'dark', autostart: true }, groups: [] };
  let activeIdx = 0;             // 当前分组下标
  let selectedId = null;
  let query = '';
  let editing = null;            // { groupId, id } 或 { groupId, id:null } 表示新增

  // ---- 标题令牌:必须与 Win32 FindWindow 匹配的标题完全一致,且保持不变 ----
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  if (token) document.title = 'QuickCopyNote\u00b7' + token;
  else document.title = 'QuickCopyNote';

  // ---- 工具 ----
  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10));
  }
  function now() { return Date.now(); }
  function activeGroup() { return state.groups[activeIdx] || null; }
  function findItem(id) {
    for (const g of state.groups) { const it = g.items.find((x) => x.id === id); if (it) return { g, it }; }
    return null;
  }
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1200);
  }

  // ---- 持久化 ----
  async function loadAll() {
    // 1) 探测服务
    try {
      const r = await fetch('/ping', { cache: 'no-store' });
      if (r.ok) {
        const j = await r.json();
        mode = 'server'; cfg.port = j.port; cfg.token = j.token || token;
        const c = await (await fetch('/api/config', { cache: 'no-store' })).json();
        cfg = { ...cfg, ...c };
        state = await (await fetch('/api/state', { cache: 'no-store' })).json();
        normalize();
        setSvc(true);
        return;
      }
    } catch (e) { /* 落到本地模式 */ }
    // 2) 本地降级
    mode = 'local';
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) { /* ignore */ }
    normalize();
    setSvc(false);
  }

  function normalize() {
    if (!state || typeof state !== 'object') state = { version: 1, ui: {}, groups: [] };
    if (!Array.isArray(state.groups)) state.groups = [];
    state.ui = state.ui || {};
    for (const g of state.groups) if (!Array.isArray(g.items)) g.items = [];
    if (state.groups.length === 0) {
      state.groups.push({ name: '默认', items: [] });
    }
    // activeGroup 名字 → 下标
    const wantName = state.ui.activeGroup;
    let idx = state.groups.findIndex((g) => g.name === wantName);
    activeIdx = idx >= 0 ? idx : 0;
  }

  let saveTimer = null;
  function persist() {
    state.ui.activeGroup = activeGroup() ? activeGroup().name : null;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doPersist, 120);
  }
  async function doPersist() {
    if (mode === 'server') {
      try { await fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) }); }
      catch (e) { toast('保存失败(服务不可达)'); }
    } else {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { toast('保存失败'); }
    }
  }

  function setSvc(ok) {
    $('#svc').innerHTML = ok
      ? '<span class="dot ok"></span>本地服务 · 端口 ' + cfg.port
      : '<span class="dot warn"></span>降级模式(localStorage) <a href="#" id="connectBtn" style="color:var(--accent)">连接服务</a>';
    $('#autostartWrap').style.display = ok ? '' : 'none';
    if (!ok) {
      const b = $('#connectBtn');
      if (b) b.onclick = (e) => { e.preventDefault(); window.open('http://127.0.0.1:' + (cfg.port || 7788) + '/', '_blank'); };
    }
    applyPositionUI(state.ui.position || 'center');
  }

  // ---- 搜索过滤 ----
  function filtered() {
    const g = activeGroup(); if (!g) return [];
    const q = query.trim().toLowerCase();
    if (!q) return g.items.slice();
    return g.items.filter((it) => {
      const hay = (it.title + ' ' + it.text + ' ' + (it.tags || []).join(' ')).toLowerCase();
      return q.split(/\s+/).every((w) => hay.includes(w));
    });
  }

  // 高亮:返回 DocumentFragment,避免 XSS(全部走 textContent)
  function highlight(text, q) {
    const frag = document.createDocumentFragment();
    if (!q) { frag.appendChild(document.createTextNode(text)); return frag; }
    const lower = text.toLowerCase();
    const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let i = 0;
    while (i < text.length) {
      let matchLen = 0;
      for (const w of words) {
        if (w && lower.startsWith(w, i)) { matchLen = Math.max(matchLen, w.length); }
      }
      if (matchLen) {
        const m = document.createElement('mark');
        m.textContent = text.slice(i, i + matchLen);
        frag.appendChild(m); i += matchLen;
      } else {
        // 收集到下一个可能命中处
        let j = i + 1;
        while (j < text.length && !words.some((w) => w && lower.startsWith(w, j))) j++;
        frag.appendChild(document.createTextNode(text.slice(i, j)));
        i = j;
      }
    }
    return frag;
  }

  // 弱语法着色(仅预览区):命令首词 + # 注释
  function colorize(text) {
    const frag = document.createDocumentFragment();
    const lines = text.split('\n');
    lines.forEach((line, li) => {
      const span = document.createElement('span');
      if (/^\s*#/.test(line)) {
        span.className = 'tok-comment'; span.textContent = line;
      } else {
        const m = line.match(/^\s*(git|curl|npm|npx|pnpm|yarn|docker|node|python|pip|ls|cd|cat|grep|find|ssh|make)\b/);
        if (m) {
          const lead = line.slice(0, m[0].length);
          const rest = line.slice(m[0].length);
          const b = document.createElement('span'); b.className = 'tok-cmd'; b.textContent = lead;
          span.appendChild(b); span.appendChild(document.createTextNode(rest));
        } else {
          span.textContent = line;
        }
      }
      frag.appendChild(span);
      if (li < lines.length - 1) frag.appendChild(document.createTextNode('\n'));
    });
    return frag;
  }

  // ---- 渲染 ----
  function renderTabs() {
    const tabs = $('#tabs'); tabs.innerHTML = '';
    state.groups.forEach((g, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === activeIdx ? ' active' : '');
      b.textContent = g.name;
      b.title = g.name + ' (' + g.items.length + ')';
      b.onclick = () => { activeIdx = i; selectedId = null; query = ''; $('#search').value = ''; persist(); render(); };
      b.oncontextmenu = (e) => { e.preventDefault(); renameGroup(i); };
      tabs.appendChild(b);
    });
  }

  function renderList() {
    const list = $('#list'); list.innerHTML = '';
    const items = filtered();
    $('#count').textContent = items.length + ' 条' + (query ? ' / 共 ' + (activeGroup()?.items.length || 0) : '');

    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      if (query) {
        li.innerHTML = '<div class="big">没有匹配的条目</div><div>按 <kbd>Ctrl</kbd>+<kbd>N</kbd> 用当前搜索词新建一条</div>';
      } else {
        li.innerHTML = '<div class="big">这个分组还是空的</div><div>按 <kbd>Ctrl</kbd>+<kbd>N</kbd> 加你的第一条</div>';
      }
      list.appendChild(li);
      renderPreview(null);
      return;
    }

    if (!items.some((x) => x.id === selectedId)) selectedId = items[0].id;

    items.forEach((it, i) => {
      const li = document.createElement('li');
      li.className = 'row' + (it.id === selectedId ? ' sel' : '');
      li.draggable = true;
      li.dataset.id = it.id;

      const idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = (i + 1);
      const body = document.createElement('div'); body.className = 'body';
      const t = document.createElement('div'); t.className = 'title'; t.appendChild(highlight(it.title || '(无标题)', query));
      const s = document.createElement('div'); s.className = 'snippet'; s.appendChild(highlight((it.text || '').split('\n')[0], query));
      body.appendChild(t); body.appendChild(s);
      if ((it.tags || []).length) {
        const tw = document.createElement('div'); tw.className = 'tags';
        it.tags.forEach((tg) => { const sp = document.createElement('span'); sp.className = 'tag'; sp.textContent = tg; tw.appendChild(sp); });
        body.appendChild(tw);
      }
      li.appendChild(idx); li.appendChild(body);

      li.onclick = () => { selectedId = it.id; render(); copyText(it.text, it.title); };
      li.ondblclick = () => openEditor(it.id);
      li.onmouseenter = () => { if (it.id !== selectedId) { selectedId = it.id; renderList(); renderPreview(it); } };

      // 拖拽排序
      li.ondragstart = (e) => { e.dataTransfer.setData('text/plain', it.id); e.dataTransfer.effectAllowed = 'move'; li.style.opacity = '.4'; };
      li.ondragend = () => { li.style.opacity = ''; };
      li.ondragover = (e) => { e.preventDefault(); li.classList.add('drag-over'); };
      li.ondragleave = () => li.classList.remove('drag-over');
      li.ondrop = (e) => {
        e.preventDefault(); li.classList.remove('drag-over');
        const dragId = e.dataTransfer.getData('text/plain');
        if (dragId && dragId !== it.id) reorder(dragId, it.id);
      };
      list.appendChild(li);
    });

    const sel = items.find((x) => x.id === selectedId);
    renderPreview(sel);
    const selEl = list.querySelector('.row.sel');
    if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }

  function renderPreview(it) {
    const pv = $('#preview');
    if (!it) { pv.innerHTML = '<div class="empty"><div class="big">未选中</div></div>'; return; }
    pv.innerHTML = '';
    const h = document.createElement('h3'); h.textContent = it.title || '(无标题)'; pv.appendChild(h);
    const pre = document.createElement('pre'); pre.appendChild(colorize(it.text || '')); pv.appendChild(pre);
    const meta = document.createElement('div'); meta.className = 'meta';
    const upd = it.updatedAt ? new Date(it.updatedAt).toLocaleString() : '—';
    meta.textContent = '标签: ' + ((it.tags || []).join(', ') || '无') + '  ·  更新: ' + upd;
    pv.appendChild(meta);
  }

  function render() {
    applyPositionUI(state.ui.position || 'center');
    renderTabs();
    renderList();
    renderPosSwitch();
    renderPin();
  }

  function applyPositionUI(pos) {
    document.body.classList.toggle('narrow', pos === 'left' || pos === 'right');
    document.body.className = document.body.className.replace(/pos-\w+/g, '').trim();
    document.body.classList.add('pos-' + pos);
    document.querySelectorAll('#posSwitch button').forEach((b) => b.classList.toggle('active', b.dataset.pos === pos));
  }
  function renderPosSwitch() {
    const pos = state.ui.position || 'center';
    document.querySelectorAll('#posSwitch button').forEach((b) => b.classList.toggle('active', b.dataset.pos === pos));
  }
  function renderPin() {
    $('#btnPin').classList.toggle('on', !!cfg.topmost);
  }

  // ---- 复制 ----
  async function copyText(text, title) {
    text = text || '';
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (e) { ok = legacyCopy(text); }
    if (ok) {
      const kb = (new Blob([text]).size / 1024).toFixed(1);
      toast('已复制「' + (title || '条目') + '」· ' + kb + ' KB');
    } else {
      toast('复制失败,请手动选择');
    }
    return ok;
  }
  function legacyCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta); return ok;
    } catch (e) { return false; }
  }

  async function hidePanel() {
    if (mode === 'server') { try { await fetch('/hide'); return; } catch (e) {} }
    // 降级:尝试关窗
    window.close();
    toast('已复制 · 按全局热键可再次唤起');
  }

  // ---- 条目操作 ----
  function copySelected() {
    const it = filtered().find((x) => x.id === selectedId);
    if (it) copyText(it.text, it.title);
  }
  function moveSel(delta) {
    const items = filtered(); if (!items.length) return;
    let i = items.findIndex((x) => x.id === selectedId);
    i = Math.max(0, Math.min(items.length - 1, i + delta));
    selectedId = items[i].id; renderList();
  }
  function jumpTo(n) {
    const items = filtered(); if (!items.length) return;
    const i = Math.max(0, Math.min(items.length - 1, n));
    selectedId = items[i].id; renderList();
  }
  function reorder(dragId, targetId) {
    const g = activeGroup(); if (!g) return;
    const from = g.items.findIndex((x) => x.id === dragId);
    const to = g.items.findIndex((x) => x.id === targetId);
    if (from < 0 || to < 0) return;
    const [moved] = g.items.splice(from, 1);
    g.items.splice(to, 0, moved);
    persist(); renderList();
  }
  function moveSelectedOrder(delta) {
    const g = activeGroup(); if (!g) return;
    const i = g.items.findIndex((x) => x.id === selectedId);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= g.items.length) return;
    const [m] = g.items.splice(i, 1); g.items.splice(j, 0, m);
    persist(); renderList();
  }
  function duplicateSelected() {
    const g = activeGroup(); if (!g) return;
    const it = g.items.find((x) => x.id === selectedId); if (!it) return;
    const copy = { ...it, id: uid(), title: it.title + ' 副本', createdAt: now(), updatedAt: now(), tags: (it.tags || []).slice() };
    const i = g.items.indexOf(it);
    g.items.splice(i + 1, 0, copy);
    selectedId = copy.id; persist(); renderList(); toast('已复制一份');
  }
  function deleteSelected() {
    const g = activeGroup(); if (!g) return;
    const i = g.items.findIndex((x) => x.id === selectedId); if (i < 0) return;
    const it = g.items[i];
    if (!confirm('删除「' + (it.title || '未命名') + '」?')) return;
    g.items.splice(i, 1);
    const items = filtered(); selectedId = items.length ? items[Math.min(i, items.length - 1)].id : null;
    persist(); render(); toast('已删除');
  }

  // ---- 分组 ----
  function addGroup() {
    const name = prompt('新分组名称(如 Claude / Cursor):');
    if (!name) return;
    if (state.groups.some((g) => g.name === name.trim())) { toast('分组已存在'); return; }
    state.groups.push({ name: name.trim(), items: [] });
    activeIdx = state.groups.length - 1; persist(); render();
  }
  function renameGroup(i) {
    const g = state.groups[i]; if (!g) return;
    const name = prompt('重命名分组:', g.name);
    if (!name || name.trim() === g.name) return;
    g.name = name.trim(); persist(); render();
  }

  // ---- 编辑器 ----
  function openEditor(id) {
    const g = activeGroup(); if (!g) return;
    if (id) {
      const it = g.items.find((x) => x.id === id); if (!it) return;
      editing = { groupId: activeIdx, id };
      $('#editorTitle').textContent = '编辑条目';
      $('#fTitle').value = it.title || ''; $('#fText').value = it.text || ''; $('#fTags').value = (it.tags || []).join(', ');
      $('#btnDelete').style.display = '';
    } else {
      editing = { groupId: activeIdx, id: null };
      $('#editorTitle').textContent = '新增条目';
      $('#fTitle').value = ''; $('#fText').value = query && !filtered().length ? query : ''; $('#fTags').value = '';
      $('#btnDelete').style.display = 'none';
    }
    $('#editor').classList.remove('hidden');
    setTimeout(() => ($('#fTitle').value ? $('#fText') : $('#fTitle')).focus(), 30);
  }
  function closeEditor() { editing = null; $('#editor').classList.add('hidden'); }
  function saveEditor() {
    if (!editing) return;
    const g = state.groups[editing.groupId]; if (!g) return closeEditor();
    const title = $('#fTitle').value.trim() || '(无标题)';
    const text = $('#fText').value;
    const tags = $('#fTags').value.split(',').map((s) => s.trim()).filter(Boolean);
    if (editing.id) {
      const it = g.items.find((x) => x.id === editing.id);
      if (it) { it.title = title; it.text = text; it.tags = tags; it.updatedAt = now(); selectedId = it.id; }
    } else {
      const it = { id: uid(), title, text, tags, createdAt: now(), updatedAt: now() };
      g.items.unshift(it); selectedId = it.id;
    }
    persist(); closeEditor(); query = ''; $('#search').value = ''; render(); toast('已保存');
  }

  // ---- 导入导出 ----
  function exportJson() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'snippets.json';
    a.click(); URL.revokeObjectURL(a.href); toast('已导出 snippets.json');
  }
  function importJson() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const obj = JSON.parse(fr.result);
          if (!obj || !Array.isArray(obj.groups)) throw new Error('格式不对');
          state = obj; normalize(); persist(); render(); toast('已导入');
        } catch (e) { toast('导入失败: ' + e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  // ---- 窗口设置 ----
  async function setPosition(pos) {
    state.ui.position = pos; applyPositionUI(pos); persist();
    if (mode === 'server') { try { await fetch('/move?pos=' + encodeURIComponent(pos)); } catch (e) {} }
  }
  async function togglePin() {
    const on = !cfg.topmost; cfg.topmost = on; renderPin();
    if (mode === 'server') { try { await fetch('/pin?on=' + (on ? '1' : '0')); } catch (e) {} }
  }
  async function loadAutostart() {
    if (mode !== 'server') return;
    try { const r = await (await fetch('/api/autostart')).json(); $('#autostart').checked = !!r.enabled; } catch (e) {}
  }
  async function toggleAutostart(on) {
    if (mode !== 'server') return;
    try { await fetch('/api/autostart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ on }) }); toast(on ? '已开启开机自启' : '已关闭开机自启'); }
    catch (e) { toast('设置失败'); }
  }

  // ---- 键盘 ----
  function isTypingTarget(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'); }

  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key;

    // 编辑器打开时
    if (!$('#editor').classList.contains('hidden')) {
      if (key === 'Escape') { e.preventDefault(); closeEditor(); return; }
      if (mod && key === 'Enter') { e.preventDefault(); saveEditor(); return; }
      if (mod && key.toLowerCase() === 's') { e.preventDefault(); saveEditor(); return; }
      return; // 其余交给输入框
    }

    // 全局功能键
    if (mod && key.toLowerCase() === 'n') { e.preventDefault(); openEditor(null); return; }
    if (mod && key.toLowerCase() === 'e') { e.preventDefault(); if (selectedId) openEditor(selectedId); return; }
    if (mod && key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); return; }
    if (mod && key.toLowerCase() === 'i') { e.preventDefault(); importJson(); return; }
    if (mod && key.toLowerCase() === 'o') { e.preventDefault(); exportJson(); return; }
    if (mod && key.toLowerCase() === 'c') { e.preventDefault(); copySelected(); return; }
    if (mod && key === 'Tab') {
      e.preventDefault();
      activeIdx = (activeIdx + (e.shiftKey ? -1 : 1) + state.groups.length) % state.groups.length;
      selectedId = null; query = ''; $('#search').value = ''; persist(); render(); return;
    }
    if (mod && /^[1-9]$/.test(key)) {
      e.preventDefault();
      const i = parseInt(key, 10) - 1;
      if (i < state.groups.length) { activeIdx = i; selectedId = null; query = ''; $('#search').value = ''; persist(); render(); }
      return;
    }
    if (mod && e.shiftKey && (key === 'ArrowUp' || key === 'ArrowDown')) {
      e.preventDefault(); moveSelectedOrder(key === 'ArrowUp' ? -1 : 1); return;
    }

    // vi 式选择:Ctrl/Alt + J/K 在任何焦点下都可用(j=下, k=上)
    const lk = key.toLowerCase();
    if ((mod || e.altKey) && (lk === 'j' || lk === 'k')) {
      e.preventDefault(); moveSel(lk === 'j' ? 1 : -1); return;
    }

    // 非修饰导航(焦点不在输入框时)
    const typing = isTypingTarget(document.activeElement);
    if (!mod && key === 'Escape') { e.preventDefault(); hidePanel(); return; }
    if (!mod && key === 'Enter') {
      e.preventDefault();
      const it = filtered().find((x) => x.id === selectedId);
      if (it) { copyText(it.text, it.title).then((ok) => { if (ok) hidePanel(); }); }
      return;
    }
    if (!mod && key === 'Delete') { e.preventDefault(); deleteSelected(); return; }
    if (!mod && key === 'ArrowDown' && !typing) { e.preventDefault(); moveSel(1); return; }
    if (!mod && key === 'ArrowUp' && !typing) { e.preventDefault(); moveSel(-1); return; }
    // 纯 j/k:普通模式下直接上下选择(vi 逻辑,j=下 k=上)
    if (!mod && !e.altKey && (lk === 'j' || lk === 'k') && !typing) {
      e.preventDefault(); moveSel(lk === 'j' ? 1 : -1); return;
    }
    if (e.altKey && (key === 'ArrowDown' || key === 'ArrowUp')) { e.preventDefault(); moveSelectedOrder(key === 'ArrowUp' ? -1 : 1); return; }
    if (e.altKey && /^[1-9]$/.test(key)) { e.preventDefault(); jumpTo(parseInt(key, 10) - 1); return; }
    if (!mod && key === 'PageDown') { e.preventDefault(); moveSel(10); return; }
    if (!mod && key === 'PageUp') { e.preventDefault(); moveSel(-10); return; }

    // '/' 开始搜索(vi 习惯):清空旧查询并聚焦搜索框
    if (!mod && !e.altKey && key === '/' && !typing) {
      e.preventDefault();
      const s = $('#search'); s.focus(); s.value = ''; query = ''; selectedId = null; renderList();
      return;
    }
    // 直接打字即搜索(焦点不在输入框时)
    if (!mod && !e.altKey && key.length === 1 && !isTypingTarget(document.activeElement)) {
      e.preventDefault();
      const s = $('#search'); s.focus(); s.value = s.value + key; query = s.value; selectedId = null; renderList();
      return;
    }
  });

  // 搜索框
  $('#search').addEventListener('input', (e) => { query = e.target.value; selectedId = null; renderList(); });
  $('#search').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); moveSel(-1); }
    else if (e.key === 'Escape') {
      e.preventDefault(); e.stopPropagation();
      if (query) { query = ''; e.target.value = ''; renderList(); e.target.blur(); } // 退回普通模式,j/k 立即可用
      else hidePanel();
    }
  });

  // 顶栏控件
  $('#btnAddGroup').onclick = addGroup;
  $('#btnPin').onclick = togglePin;
  document.querySelectorAll('#posSwitch button').forEach((b) => (b.onclick = () => setPosition(b.dataset.pos)));
  $('#autostart').addEventListener('change', (e) => toggleAutostart(e.target.checked));

  // 面板被隐藏后经全局热键(或 /summon)重新唤起:窗口重新拿到前台/可见时,
  // 把文档焦点归位到「普通模式」(焦点在 body),这样 j/k、方向键、打字搜索
  // 立刻可用,无需鼠标点击。注意:这里绝不能聚焦搜索框,否则纯 j/k 会被当成打字。
  function refocusPanel() {
    if (!$('#editor').classList.contains('hidden')) return; // 编辑器开着别打扰
    try { window.focus(); } catch (e) { /* ignore */ }
    const a = document.activeElement;
    if (a && a !== document.body && typeof a.blur === 'function') a.blur();
  }
  window.addEventListener('focus', refocusPanel);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refocusPanel(); });

  // 编辑器按钮
  $('#btnCancel').onclick = closeEditor;
  $('#btnSave').onclick = saveEditor;
  $('#btnDelete').onclick = () => { if (editing && editing.id) { closeEditor(); deleteSelected(); } };
  $('#editor').addEventListener('mousedown', (e) => { if (e.target.id === 'editor') closeEditor(); });

  // ---- 启动 ----
  (async function init() {
    await loadAll();
    render();
    loadAutostart();
    // 按上次保存的位置(left/center/right)校正窗口几何:上下填满 + 对应水平位置
    if (mode === 'server') {
      const pos = state.ui.position || 'center';
      try { await fetch('/move?pos=' + encodeURIComponent(pos)); } catch (e) { /* ignore */ }
    }
    // 打开即处于「普通模式」:焦点留在 body,纯 j/k 直接上下选择;
    // 按 '/' 或直接打字进入搜索(插入模式),Esc 退回普通模式。
  })();
})();
</script>
</body>
</html>
